# A directory backup target on its own volume, the password locked by a secret, nightly at 03:15
# UTC, keeping 14 dailies. Bundled Postgres, files local, generated keys.
publicUrl: http://kept.lan:8080
image:
  tag: 1.0.0
postgres:
  superuserSecret: kept-postgres
roles:
  existingSecret: kept-db
backup:
  existingSecret: kept-backup
  env:
    KEPT_BACKUP_TIME: "03:15"
    KEPT_BACKUP_KEEP_DAILY: 14
  persistence:
    enabled: true
    size: 50Gi
    storageClass: local-path
service:
  type: NodePort
