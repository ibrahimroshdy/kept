apiVersion: batch/v1
kind: Job
metadata:
  name: kept-db-roles
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: db-roles
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kept
        app.kubernetes.io/instance: kept
        app.kubernetes.io/component: db-roles
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roles
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "#!/usr/bin/env bash\n# Kept's four logins and its extensions (D186), for the chart. The same statements as the\n# managed-Postgres page's SQL (apps/docs/src/content/docs/install/managed-postgres.md), so they run\n# as a superuser (the bundled Postgres, at its first start, from /docker-entrypoint-initdb.d) or\n# as a provider's admin (the roles Job, external Postgres with roles.create). Unlike\n# docker/initdb-prod/01-roles.sh it is idempotent: a login that exists gets its password reset to\n# the secret's, so a re-install over a kept database converges instead of failing.\n#\n# Connection: libpq's PG* variables (the Job sets PGHOST, PGPORT, PGPASSWORD, PGSSLMODE); unset,\n# the local socket (initdb). Passwords reach psql as variables (:'name' quotes them as literals),\n# never spliced into SQL text.\nset -euo pipefail\n\n: \"${KEPT_DB_OWNER_PASSWORD:?KEPT_DB_OWNER_PASSWORD is required}\"\n: \"${KEPT_DB_APP_PASSWORD:?KEPT_DB_APP_PASSWORD is required}\"\n: \"${KEPT_DB_AUTH_PASSWORD:?KEPT_DB_AUTH_PASSWORD is required}\"\n: \"${KEPT_DB_SYSTEM_PASSWORD:?KEPT_DB_SYSTEM_PASSWORD is required}\"\n\ndb=${POSTGRES_DB:-kept}\n\npsql -v ON_ERROR_STOP=1 --no-psqlrc --username \"${POSTGRES_USER:-postgres}\" --dbname \"$db\" \\\n  -v owner_pw=\"$KEPT_DB_OWNER_PASSWORD\" \\\n  -v app_pw=\"$KEPT_DB_APP_PASSWORD\" \\\n  -v auth_pw=\"$KEPT_DB_AUTH_PASSWORD\" \\\n  -v system_pw=\"$KEPT_DB_SYSTEM_PASSWORD\" \\\n  -v db=\"$db\" <<'SQL'\nSELECT NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kept_owner')  AS make_owner,\n       NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kept_app')    AS make_app,\n       NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kept_auth')   AS make_auth,\n       NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kept_system') AS make_system\n\\gset\n\\if :make_owner\nCREATE ROLE kept_owner  LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS;\n\\endif\n\\if :make_app\nCREATE ROLE kept_app    LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS;\n\\endif\n\\if :make_auth\nCREATE ROLE kept_auth   LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS;\n\\endif\n\\if :make_system\nCREATE ROLE kept_system LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS;\n\\endif\nALTER ROLE kept_owner  PASSWORD :'owner_pw';\nALTER ROLE kept_app    PASSWORD :'app_pw';\nALTER ROLE kept_auth   PASSWORD :'auth_pw';\nALTER ROLE kept_system PASSWORD :'system_pw';\n-- A request can't run away or sit idle inside a transaction.\nALTER ROLE kept_app SET statement_timeout = '15s';\nALTER ROLE kept_app SET idle_in_transaction_session_timeout = '30s';\nCREATE EXTENSION IF NOT EXISTS pg_trgm  WITH SCHEMA public;\nCREATE EXTENSION IF NOT EXISTS unaccent WITH SCHEMA public;\nCREATE EXTENSION IF NOT EXISTS vector   WITH SCHEMA public;\n-- A non-superuser admin may hand ownership to a role only while it is a member of that role.\nGRANT kept_owner TO CURRENT_USER;\nALTER DATABASE :\"db\" OWNER TO kept_owner;\nALTER SCHEMA public OWNER TO kept_owner;\nREVOKE kept_owner FROM CURRENT_USER;\nSQL\necho \"kept: the four logins and the extensions are in place in $db\"\n"]
          env:
            - name: PGHOST
              value: "db.example.internal"
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: "require"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-pg-admin
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "kept"
            - name: KEPT_DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_OWNER_PASSWORD
            - name: KEPT_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_APP_PASSWORD
            - name: KEPT_DB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_AUTH_PASSWORD
            - name: KEPT_DB_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_SYSTEM_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

