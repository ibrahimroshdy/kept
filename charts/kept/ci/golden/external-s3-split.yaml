            - name: KEPT_TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: KEPT_BACKUP_S3_BUCKET
              value: "kept-backups"
            - name: KEPT_BACKUP_S3_ENDPOINT
              value: "https://s3.eu-central-1.amazonaws.com"
            - name: KEPT_BACKUP_S3_REGION
