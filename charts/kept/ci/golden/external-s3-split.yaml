# Source: kept/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kept-web
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kept
      app.kubernetes.io/instance: kept
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kept
        app.kubernetes.io/instance: kept
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kept-0.0.0-dev
        app.kubernetes.io/component: web
    spec:
      # Kubernetes would otherwise inject KEPT_PORT=tcp://… for a Service named `kept`, which Kept
      # reads as its listening port.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -q -h "$DB_HOST" -p "$DB_PORT" -t 5; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
          env:
            - name: DB_HOST
              value: "db.example.internal"
            - name: DB_PORT
              value: "5432"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: kept
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KEPT_ROLE
              value: web
            - name: KEPT_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_APP_PASSWORD
            - name: KEPT_DATABASE_URL
              value: "postgres://kept_app:$(KEPT_DB_APP_PASSWORD)@db.example.internal:5432/kept?sslmode=require"
            - name: KEPT_DB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_AUTH_PASSWORD
            - name: KEPT_AUTH_DATABASE_URL
              value: "postgres://kept_auth:$(KEPT_DB_AUTH_PASSWORD)@db.example.internal:5432/kept?sslmode=require"
            - name: KEPT_DB_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_SYSTEM_PASSWORD
            - name: KEPT_SYSTEM_DATABASE_URL
              value: "postgres://kept_system:$(KEPT_DB_SYSTEM_PASSWORD)@db.example.internal:5432/kept?sslmode=require"
            - name: KEPT_PUBLIC_URL
              value: "https://kept.example.org"
            - name: KEPT_STORAGE
              value: "s3"
            - name: KEPT_S3_ENDPOINT
              value: "https://s3.eu-central-1.amazonaws.com"
            - name: KEPT_S3_REGION
              value: "eu-central-1"
            - name: KEPT_S3_BUCKET
              value: "kept-files"
            - name: KEPT_S3_FORCE_PATH_STYLE
              value: "false"
            - name: KEPT_SMTP_FROM
              value: "Kept <kept@example.org>"
            - name: KEPT_TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: KEPT_BACKUP_S3_BUCKET
              value: "kept-backups"
            - name: KEPT_BACKUP_S3_ENDPOINT
              value: "https://s3.eu-central-1.amazonaws.com"
            - name: KEPT_BACKUP_S3_REGION
              value: "eu-central-1"
          envFrom:
            - secretRef:
                name: kept-keys
            - secretRef:
                name: kept-s3
            - secretRef:
                name: kept-backup
            - secretRef:
                name: kept-smtp
            - secretRef:
                name: kept-metrics
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the Service drop this pod before it stops answering (L97).
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}

