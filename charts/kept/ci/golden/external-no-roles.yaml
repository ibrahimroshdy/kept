# Source: kept/templates/tests/test-version.yaml
apiVersion: v1
kind: Pod
metadata:
  name: kept-test
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  enableServiceLinks: false
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: version
      image: ghcr.io/ibrahimroshdy/kept:1.0.0
      imagePullPolicy: IfNotPresent
      command:
        - node
        - --input-type=module
        - -e
        - |
          const base = process.env.KEPT_TEST_URL;
          const ready = await fetch(`${base}/readyz`);
          if (ready.status !== 200) throw new Error(`/readyz answered ${ready.status}`);
          const res = await fetch(`${base}/version`);
          const body = await res.json();
          if (res.status !== 200 || typeof body.version !== 'string' || !body.version) {
            throw new Error(`/version answered ${res.status}: ${JSON.stringify(body)}`);
          }
          console.log(`kept ${body.version} (${body.revision ?? 'no revision'}) is ready`);
      env:
        - name: KEPT_TEST_URL
          value: http://kept:8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

