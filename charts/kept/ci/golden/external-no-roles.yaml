# Source: kept/templates/jobs.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kept-migrate
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # A failed migration is not retried blindly: its log says why (`kubectl logs job/…`).
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kept
        app.kubernetes.io/instance: kept
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -q -h "$DB_HOST" -p "$DB_PORT" -t 5; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
          env:
            - name: DB_HOST
              value: "kept.postgres.database.azure.com"
            - name: DB_PORT
              value: "5432"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: migrate
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["kept"]
          args: ["migrate"]
          env:
            - name: KEPT_DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_OWNER_PASSWORD
            - name: KEPT_OWNER_DATABASE_URL
              value: "postgres://kept_owner:$(KEPT_DB_OWNER_PASSWORD)@kept.postgres.database.azure.com:5432/kept?sslmode=verify-full"
            # restic's cache, never on a volume the running pod holds.
            - name: KEPT_RESTIC_CACHE_DIR
              value: /tmp/restic-cache
            - name: KEPT_PUBLIC_URL
              value: "https://kept.example.org"
            - name: KEPT_STORAGE
              value: "local"
          envFrom:
            - secretRef:
                name: kept-keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}

