# Source: kept/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kept
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kept
      app.kubernetes.io/instance: kept
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kept
        app.kubernetes.io/instance: kept
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kept-0.0.0-dev
        app.kubernetes.io/component: server
    spec:
      # Kubernetes would otherwise inject KEPT_PORT=tcp://… for a Service named `kept`, which Kept
      # reads as its listening port.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -q -h "$DB_HOST" -p "$DB_PORT" -t 5; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
          env:
            - name: DB_HOST
              value: "kept-postgres"
            - name: DB_PORT
              value: "5432"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: kept
          image: ghcr.io/ibrahimroshdy/kept:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KEPT_ROLE
              value: all
            - name: KEPT_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_APP_PASSWORD
            - name: KEPT_DATABASE_URL
              value: "postgres://kept_app:$(KEPT_DB_APP_PASSWORD)@kept-postgres:5432/kept"
            - name: KEPT_DB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_AUTH_PASSWORD
            - name: KEPT_AUTH_DATABASE_URL
              value: "postgres://kept_auth:$(KEPT_DB_AUTH_PASSWORD)@kept-postgres:5432/kept"
            - name: KEPT_DB_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_SYSTEM_PASSWORD
            - name: KEPT_SYSTEM_DATABASE_URL
              value: "postgres://kept_system:$(KEPT_DB_SYSTEM_PASSWORD)@kept-postgres:5432/kept"
            - name: KEPT_DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_OWNER_PASSWORD
            - name: KEPT_OWNER_DATABASE_URL
              value: "postgres://kept_owner:$(KEPT_DB_OWNER_PASSWORD)@kept-postgres:5432/kept"
            - name: KEPT_PUBLIC_URL
              value: "http://kept.lan:8080"
            - name: KEPT_STORAGE
              value: "local"
            - name: KEPT_BACKUP_DIR
              value: /backups
            - name: KEPT_BACKUP_KEEP_DAILY
              value: "14"
            - name: KEPT_BACKUP_TIME
              value: "03:15"
          envFrom:
            - secretRef:
                name: kept-backup
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the Service drop this pod before it stops answering (L97).
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: backups
              mountPath: /backups
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: kept-data
        - name: config
          persistentVolumeClaim:
            claimName: kept-config
        - name: backups
          persistentVolumeClaim:
            claimName: kept-backups

