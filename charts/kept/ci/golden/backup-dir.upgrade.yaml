# Source: kept/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kept-postgres
  labels:
    app.kubernetes.io/name: kept
    app.kubernetes.io/instance: kept
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kept-0.0.0-dev
    app.kubernetes.io/component: postgres
spec:
  serviceName: kept-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kept
      app.kubernetes.io/instance: kept
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kept
        app.kubernetes.io/instance: kept
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kept-0.0.0-dev
        app.kubernetes.io/component: postgres
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # The image's postgres user (uid 999). PGDATA lives under the volume's root
      # (/var/lib/postgresql/18/docker), which the entrypoint creates as that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "kept"
            - name: TZ
              value: UTC
            - name: KEPT_DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_OWNER_PASSWORD
            - name: KEPT_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_APP_PASSWORD
            - name: KEPT_DB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_AUTH_PASSWORD
            - name: KEPT_DB_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kept-db
                  key: KEPT_DB_SYSTEM_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            # Over TCP: during init the server listens on the socket only.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "kept"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "kept"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: kept-db-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kept
          app.kubernetes.io/instance: kept
          app.kubernetes.io/component: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
