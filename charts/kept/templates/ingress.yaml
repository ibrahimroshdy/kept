{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | default (regexReplaceAll ":[0-9]+$" (urlParse .Values.publicUrl).host "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kept.fullname" . }}
  labels:
    {{- include "kept.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "kept.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kept.fullname" . }}
                port:
                  name: http
{{- end }}
