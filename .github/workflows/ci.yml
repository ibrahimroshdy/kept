# Kept's CI on GitHub Actions (D87, D187, Q20). INERT until the repository is public: every job is
# gated on `github.event.repository.private == false`, so while it is private nothing runs (and
# Actions' billing is never touched). The gate that counts is local: `bash scripts/ci-local.sh`
# (CONTRIBUTING.md). This mirrors the steps a hosted runner can do: ci-local's --fast run, the
# licence allowlist, the no-AI-attribution check on a pull request's commits and description, and
# the DCO sign-off on its commits.
#
# Every action is pinned by commit SHA with its tag in a comment (spike W1,
# docs/spikes/2026-10-06-step8-workflows.md); Renovate keeps both current once it is enabled.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint, catalogues, typecheck, the unit tests (no database) and the mock evaluation.
      - run: bash scripts/ci-local.sh --fast
      - run: node scripts/check-licences.mjs

  attribution:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # D173: no AI attribution in any commit of the pull request, nor in its description. The
      # description reaches the script through the environment and a file, never the shell text.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash scripts/check-attribution.sh --range "$BASE..$HEAD"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/check-attribution.sh "$RUNNER_TEMP/pr-body.txt"

  dco:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Developer Certificate of Origin (CONTRIBUTING.md): every commit of the pull request is
      # signed off by its author (`git commit -s`). No bot, no third-party app.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh --range "$BASE..$HEAD"
