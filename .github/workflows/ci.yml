# Kept's CI on GitHub Actions (D87, D187, Q20, D222). This IS the gate: every pull request and every
# push to main runs all of scripts/ci-local.sh except perf, as parallel jobs on GitHub-hosted
# runners, free on a public repository (D222). The jobs below are the required checks on main
# (scripts/repo-settings.sh), so main is always releasable and a release needs no laptop run.
#   fast           lint, catalogues, typecheck, the unit tests, the mock evaluation; licences
#   db-test        the server's tests on the dev Postgres (pgvector) and RustFS
#   db-ops         migration drift, a production boot, portability and backup
#   db             the required check: green exactly when both halves are
#   e2e-shard      Playwright against the built server in four shards, on scratch databases
#   e2e-update     the step-3 update migration spec on its own, so it runs exactly once
#   e2e            the required check: green exactly when every shard and the update spec are
#   images-amd64,  the image built natively on each architecture's runner and smoked in full
#   images-arm64   (scripts/smoke-image.sh)
#   helm           the chart's lint, render and schema check at the pinned Helm and kubeconform
#   attribution,   on a pull request: no AI attribution (D173), every commit signed off (DCO)
#   dco
# docs.yml's `build` builds the docs site (its link check included). perf runs nightly in
# perf.yml: timing limits on a shared runner are a report, not a gate. Each job runs its slice of
# the same script a developer runs (`ci-local.sh --only …`), so a failure reproduces locally.
#
# Every job is gated on `github.event.repository.private == false`: on a private repository
# Actions minutes are billed, and nothing here runs.
#
# Every action is pinned by commit SHA with its tag in a comment (spike W1,
# docs/spikes/2026-10-06-step8-workflows.md); Renovate keeps both current once it is enabled.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, everything: main's own runs skip a tree its pull request already passed (the changes
  # job), so a flaky test surfaces here instead.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; a run on main always finishes, because
  # release.yml refuses a tag whose commit has no successful ci run (a cancelled one never does).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run needs to test. Fail-open: every job below runs unless this job said, in so many
  # words, that it needn't (`!cancelled()` and `!= 'false'`), so a decide step that fails, or a
  # changes job that fails outright, runs everything.
  #   reused  on a push to main: the commit's tree is the tree its pull request's ci run passed
  #           (strict up-to-date + squash make them identical), so nothing runs twice
  #   unit    fast's unit tests and evaluations (scripts/ci-changes.sh: false for prose only)
  #   heavy   db, e2e, the images and helm (false for prose and the docs site only)
  changes:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the pull request's ci run
      pull-requests: read # the pull request behind a push to main
    outputs:
      reused: ${{ steps.decide.outputs.reused }}
      unit: ${{ steps.decide.outputs.unit }}
      heavy: ${{ steps.decide.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ $EVENT == schedule || $EVENT == workflow_dispatch ]]; then
            printf 'reused=false\nunit=true\nheavy=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $EVENT == push ]]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
            if [[ -n $pr ]]; then
              head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
              git fetch -q origin "refs/pull/$pr/head"
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
              if [[ $(git rev-parse "$head^{tree}") == $(git rev-parse "HEAD^{tree}") && $passed -gt 0 ]]; then
                echo "main's tree is #$pr's ${head:0:12}, whose ci run passed: nothing to run again"
                printf 'reused=true\nunit=false\nheavy=false\n' >>"$GITHUB_OUTPUT"
                exit 0
              fi
              echo "#$pr: tree differs or no passing ci run on ${head:0:12}; deciding by paths"
            fi
          fi
          git diff --name-only "$BASE...$HEAD" | tee "$RUNNER_TEMP/changed.txt"
          bash scripts/ci-changes.sh <"$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  fast:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint, catalogues, typecheck, the unit tests (no database) and the mock evaluation.
      - if: needs.changes.outputs.unit != 'false'
        run: bash scripts/ci-local.sh --fast
      # Prose only (scripts/ci-changes.sh): the checks that read every file, no unit tests.
      - if: needs.changes.outputs.unit == 'false'
        run: bash scripts/ci-local.sh --only lint,catalogues,typecheck
      - run: node scripts/check-licences.mjs

  db-test:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_VITEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-local.sh --only compose,test

  db-ops:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-local.sh --only compose,drift,prod-boot,portability,backup

  # The required check: green exactly when both halves are (skipped only while private,
  # when nothing here runs or is required).
  db:
    if: ${{ always() && github.event.repository.private == false }}
    needs: [db-test, db-ops]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in $(echo '${{ toJSON(needs.*.result) }}' | jq -r '.[]'); do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done

  e2e-shard:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-local.sh --only compose,e2e
      # Playwright's report and traces when a spec fails, kept for a week.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: .tmp/e2e/results
          retention-days: 7

  e2e-update:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-local.sh --only compose,e2e-update
      # Playwright's report and traces when a spec fails, kept for a week.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-update
          path: .tmp/e2e/results
          retention-days: 7

  # The required check: green exactly when every shard and the update spec are (skipped
  # only while private, when nothing here runs or is required).
  e2e:
    if: ${{ always() && github.event.repository.private == false }}
    needs: [e2e-shard, e2e-update]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in $(echo '${{ toJSON(needs.*.result) }}' | jq -r '.[]'); do
            [ "$r" = success ] || [ "$r" = skipped ] || exit 1
          done

  images-amd64:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci-local.sh --only images

  images-arm64:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci-local.sh --only images

  helm:
    needs: changes
    if: ${{ !cancelled() && github.event.repository.private == false && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/tools.sh fetch helm kubeconform
      - run: bash scripts/ci-local.sh --only helm

  attribution:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # D173: no AI attribution in any commit of the pull request, nor in its description. The
      # description reaches the script through the environment and a file, never the shell text.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash scripts/check-attribution.sh --range "$BASE..$HEAD"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/check-attribution.sh "$RUNNER_TEMP/pr-body.txt"

  dco:
    if: github.event.repository.private == false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Developer Certificate of Origin (CONTRIBUTING.md): every commit of the pull request is
      # signed off by its author (`git commit -s`). No bot, no third-party app.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh --range "$BASE..$HEAD"
