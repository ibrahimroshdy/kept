# The docs site (D199, plan T18/T20). INERT until the repository is public: every job is gated on
# `github.event.repository.private == false`. Once public, a pull request and a push to main build
# the site (the link check fails a broken link); only a release tag deploys it to GitHub Pages, so
# the site always describes the latest release, never unreleased work on main. A final release
# (`vX.Y.Z`) deploys; a prerelease (`vX.Y.Z-rc.1`) builds only. A manual run deploys only from a
# release tag (`gh workflow run docs.yml --ref vX.Y.Z`), to redeploy the current release's docs.
# The github-pages environment must allow tags `v*` (scripts/repo-settings.sh, group pages).
#
# The site is served at https://ibrahimroshdy.com/kept/: a project site under the maintainer's
# GitHub Pages user site, whose custom domain is ibrahimroshdy.com (ibrahimroshdy.github.io/kept/
# redirects there). The build is told that origin and base path directly, as KEPT_DOCS_SITE and
# KEPT_DOCS_BASE (apps/docs/astro.config.mjs), so pull requests build the same links as main.
# Pages must be enabled with "GitHub Actions" as its source (a maintainer step on the 1.0
# checklist). Actions pinned by commit SHA (spike W1).
name: docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A final release tag, pushed or run by hand: the only refs that deploy (see the header).
      DEPLOY: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kept/docs check:config
      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - env:
          KEPT_DOCS_SITE: https://ibrahimroshdy.com
          KEPT_DOCS_BASE: /kept
        run: pnpm docs:build
      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
